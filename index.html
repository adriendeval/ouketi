<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oukéti?</title>
    <script src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        textarea {
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 16px;
            background-color: #202020;
            color: white;
            border: none;
            width: 97%;
            height: 200px;
            resize: none;
            border-radius: 4px;
            cursor: text;
            padding: 10px;

            &::selection {
                background-color: #fff;
                color: #000;
            }
        }

        div {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        button {
            margin: 3px;
            padding: 4px 8px;
            font-size: 16px;
            border: 1px solid #00000066;
            border-radius: 4px;
            cursor: pointer;
            background-color: #ffffff44;

            &:hover {
                background-color: #ffffff88;

            }
        }

        abbr {
            cursor: pointer;
        }
    </style>
</head>

<body onload="bodyOnLoad()">

    <h1>Oukéti ?</h1>

    <div id="motsClesRestants" style="background-color: #FFC9C9; border: 2px solid #FFA2A2;"></div>

    <div id="motsClesSelectionnes" style="background-color: #A4F4CF; border: 2px solid #5EE9B5;">Mots-clés sélectionnés : </div>

    <button onclick="buttonSendOnClick()">Envoyer</button>

    <hr>

    <h2>Debug</h2>

    <textarea id="debug" readonly></textarea>

</body>

</html>
