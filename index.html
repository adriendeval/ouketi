<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oukéti?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="script.js"></script>
</head>

<body onload="bodyOnLoad()">

    <div class="container mt-4">
        <h1 class="text-center mb-4">Oukéti ?</h1>

        <div class="card mb-4">
            <div class="card-header" id="motsClesRestantsHeader">
                Mots Clés Disponibles
            </div>
            <div id="motsClesRestants" class="card-body">
                <!-- Les boutons de mots-clés seront générés ici -->
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                Mots-clés sélectionnés
            </div>
            <div id="motsClesSelectionnes" class="card-body">
                <!-- Les mots-clés sélectionnés et leurs détails seront affichés ici -->
            </div>
        </div>

        <button class="btn btn-primary" onclick="buttonSendOnClick()">Envoyer la sélection</button>

        <hr class="my-4">

        <div class="accordion" id="debugAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="debugHeader">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDebug" aria-expanded="false" aria-controls="collapseDebug">
                        Debug
                    </button>
                </h2>
                <div id="collapseDebug" class="accordion-collapse collapse" aria-labelledby="debugHeader" data-bs-parent="#debugAccordion">
                    <div class="accordion-body p-0">
                        <textarea id="debug" class="form-control border-0" style="height: 200px; background-color: #202020; color: white; font-family: 'Consolas', 'Courier New', Courier, monospace;" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
